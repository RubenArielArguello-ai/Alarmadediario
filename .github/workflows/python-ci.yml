name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            elif [ -f docs/ideas/requirements.txt ]; then
              pip install -r docs/ideas/requirements.txt
            elif [ -f hibrido/requirements.txt ]; then
              pip install -r hibrido/requirements.txt
            else
              echo "No se encontró un archivo requirements.txt"
              exit 1
            fi
      - name: Check Python syntax
        run: |
          python -m py_compile *.py harness/*.py hibrido/*.py || true

      - name: Run tests (if any)
        run: |
          python -m unittest discover -s tests -p "test_*.py" || true
